<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hvor hårdt er dit vand?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfbfa;--fg:#14202b;--mute:#6b7782;--line:#dfe4e8;--accent:#1f5f8b}
@media (prefers-color-scheme:dark){:root{--bg:#0f161c;--fg:#e8eef2;--mute:#8d9aa5;--line:#26323b;--accent:#6bb2dc}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.5 "Lilita One","Trebuchet MS",Verdana,sans-serif;font-weight:400;display:flex;justify-content:center;padding:12vh 24px 48px}
main{width:100%;max-width:520px}
h1{font-size:clamp(28px,6vw,38px);font-weight:400;letter-spacing:.01em;margin:0 0 32px}
label{display:block;color:var(--mute);font-size:15px;margin-bottom:8px}
select{width:100%;font:inherit;font-weight:400;font-size:24px;padding:8px 0;border:0;border-bottom:2px solid var(--line);background:transparent;color:var(--fg);outline:none;border-radius:0;cursor:pointer}
select:focus{border-bottom-color:var(--accent)}
option{color:#14202b;background:#fff}
#out{margin-top:40px;min-height:220px}
.kommune{color:var(--mute);margin:0 0 4px}
.big{font-size:clamp(56px,16vw,88px);line-height:1;font-weight:400;color:var(--accent)}
.big small{font-size:.35em;color:var(--mute);margin-left:6px;font-weight:400}
.cat{font-size:22px;margin:8px 0 24px}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.scale i{height:8px;background:var(--line);display:block}
.scale i.on{background:var(--accent)}
.legend{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:8px}
.msg{color:var(--mute)}
footer{margin-top:56px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Hvor hårdt er dit vand?</h1>
  <label for="kom">Vælg din kommune</label>
  <select id="kom"><option value="">Vælg kommune</option></select>
  <div id="out" aria-live="polite"></div>
  <footer>Hårdhed i °dH, gennemsnit for kommunen. Kilde: GEUS. Hårdheden kan variere mellem vandværker i samme kommune.</footer>
</main>

<script>
/* ============================================================
   HÅRDHED PR. KOMMUNE (°dH)
   Gennemsnitlig hårdhed pr. kommune, hentet fra Excel-arket "Hårdhed med kommune".
   null = ingen data i kildearket.
   ============================================================ */
const HARDNESS = {
"Aabenraa":11.5,"Aalborg":12.2,"Aarhus":14.8,"Albertslund":21.6,"Allerød":16.4,"Assens":16.5,"Ballerup":19.3,"Billund":6.8,"Bornholm":15.1,"Brøndby":null,"Brønderslev":10.2,"Christiansø":null,"Dragør":23.4,"Egedal":19.3,"Esbjerg":8.5,"Faaborg-Midtfyn":16.2,"Fanø":7.4,"Favrskov":12.6,"Faxe":17.3,"Fredensborg":14.7,"Fredericia":14.4,"Frederiksberg":11.6,"Frederikshavn":9.7,"Frederikssund":17.1,"Furesø":17.2,"Gentofte":18.3,"Gladsaxe":18.2,"Glostrup":24.0,"Greve":20.9,"Gribskov":16.8,"Guldborgsund":18.4,"Haderslev":12.9,"Halsnæs":16.2,"Hedensted":14.2,"Helsingør":14.3,"Herlev":null,"Herning":6.9,"Hillerød":14.9,"Hjørring":11.8,"Holbæk":17.2,"Holstebro":8.5,"Horsens":13.3,"Hvidovre":20.1,"Høje-Taastrup":22.9,"Hørsholm":18.2,"Ikast-Brande":6.7,"Ishøj":20.9,"Jammerbugt":12.3,"Kalundborg":18.1,"Kerteminde":18.0,"Kolding":12.3,"København":37,"Køge":19.4,"Langeland":22.0,"Lejre":16.8,"Lemvig":7.6,"Lolland":19.6,"Lyngby-Taarbæk":null,"Læsø":5.3,"Mariagerfjord":13.7,"Middelfart":17.6,"Morsø":11.5,"Norddjurs":12.8,"Nordfyns":16.3,"Nyborg":17.9,"Næstved":15.7,"Odder":16.8,"Odense":17.6,"Odsherred":16.4,"Randers":12.8,"Rebild":11.3,"Ringkøbing-Skjern":6.8,"Ringsted":17.5,"Roskilde":16.9,"Rudersdal":19.6,"Rødovre":22.1,"Samsø":17.3,"Silkeborg":9.5,"Skanderborg":12.1,"Skive":11.3,"Slagelse":17.1,"Solrød":19.1,"Sorø":15.3,"Stevns":18.7,"Struer":19.5,"Svendborg":17.4,"Syddjurs":13.2,"Sønderborg":16.3,"Thisted":13.6,"Tårnby":19.0,"Tønder":11.7,"Vallensbæk":null,"Varde":8.4,"Vejen":9.7,"Vejle":10.9,"Vesthimmerlands":10.9,"Viborg":10.0,"Vordingborg":18.7,"Ærø":17.3
};

const STEPS = [
  {max:4,  name:"Meget blødt"},
  {max:8,  name:"Blødt"},
  {max:12, name:"Middelhårdt"},
  {max:18, name:"Temmelig hårdt"},
  {max:24, name:"Hårdt"},
  {max:30, name:"Meget hårdt"},
  {max:Infinity, name:"Særdeles hårdt"}
];
const stepIndex = d => STEPS.findIndex(s => d <= s.max);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const sel = document.getElementById("kom");
const out = document.getElementById("out");

const sortKey = n => n.replace(/^Aa/,"A");
Object.keys(HARDNESS)
  .sort((a,b)=>sortKey(a).localeCompare(sortKey(b),"da"))
  .forEach(n => sel.insertAdjacentHTML("beforeend",'<option>'+esc(n)+'</option>'));

function show(name){
  if (!name) { out.innerHTML = ""; return; }
  const d = HARDNESS[name];
  if (d == null) {
    out.innerHTML = '<p class="kommune">'+esc(name)+' Kommune</p><p class="msg">Vi har ikke data for kommunen endnu.</p>';
    return;
  }
  const i = stepIndex(d);
  const bars = STEPS.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join("");
  out.innerHTML = '<p class="kommune">'+esc(name)+' Kommune</p>'
    + '<div class="big">'+String(d).replace(".",",")+'<small>°dH</small></div>'
    + '<p class="cat">'+STEPS[i].name+'</p>'
    + '<div class="scale" aria-hidden="true">'+bars+'</div>'
    + '<div class="legend"><span>Blødt</span><span>Hårdt</span></div>';
}

sel.addEventListener("change", () => show(sel.value));
</script>
</body>
</html>
